syntax = "proto3";

package cdf.common;

option go_package = "github.com/cognitive-data-fabric/cdf/proto/common";
option java_multiple_files = true;

// Core identifiers
message Uuid {
  bytes value = 1;
}

message ContentHash {
  bytes blake3_hash = 1;
}

// Temporal dimensions
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message TemporalBounds {
  Timestamp valid_time_start = 1;
  Timestamp valid_time_end = 2;
  Timestamp transaction_time = 3;
}

// Probabilistic types
message NormalDistribution {
  double mean = 1;
  double std_dev = 2;
}

message ConfidenceInterval {
  double lower = 1;
  double upper = 2;
  double confidence = 3; // e.g., 0.95
}

// Poly-modal value types
message PolyValue {
  oneof value {
    double scalar = 1;
    string text = 2;
    bytes raw = 3;
    VectorEmbedding embedding = 4;
    TensorValue tensor = 5;
    NormalDistribution distribution = 6;
    ContentHash blob_ref = 7;
  }
}

message VectorEmbedding {
  repeated float values = 1 [packed = true];
  string model_id = 2; // e.g., "sentence-transformers/all-MiniLM-L6-v2"
}

message TensorValue {
  repeated float data = 1 [packed = true];
  repeated uint32 shape = 2;
  string dtype = 3;
}

// Schema
message ColumnSchema {
  string name = 1;
  ColumnType type = 2;
  bool nullable = 3;
  map<string, string> annotations = 4;
}

enum ColumnType {
  SCALAR = 0;
  TEXT = 1;
  BLOB_REF = 2;
  VECTOR = 3;
  TENSOR = 4;
  DISTRIBUTION = 5;
  TEMPORAL = 6;
  GRAPH_EDGE = 7;
}

message TableSchema {
  string name = 1;
  repeated ColumnSchema columns = 2;
  map<string, string> options = 3;
}
