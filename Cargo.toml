[workspace]
members = [
    "crates/cdf-common",
    "crates/cdf-storage",
    "crates/cdf-vector",
    "crates/cdf-graph",
    "crates/cdf-temporal",
    "crates/cdf-prob",
    "crates/cdf-auth",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cognitive Data Fabric Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cognitive-data-fabric/cdf"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flatbuffers = "23.5"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# gRPC / networking
tonic = "0.11"
prost = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & metrics
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.13"

# Data structures
parking_lot = "0.12"
dashmap = "5.5"
crossbeam = "0.8"
rayon = "1.8"

# Crypto / IDs
uuid = { version = "1.6", features = ["v4", "serde"] }
blake3 = "1.5"
hex = "0.4"

# SIMD / Math
packed_simd_2 = "0.3"
num-traits = "0.2"

# Binary serialization
bincode = "1.3"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

# Internal crates
cdf-common = { path = "crates/cdf-common" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1
debug = true
