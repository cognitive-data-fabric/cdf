name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

      - name: Build workspace
        run: cargo build --workspace

      - name: Test cdf-common
        run: cargo test -p cdf-common

      - name: Test cdf-auth
        run: cargo test -p cdf-auth

  go:
    name: Go Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go services
        run: |
          cd cmd/cdf-gateway && go mod tidy && go build .
          cd ../cdf-router && go mod tidy && go build .
          cd ../cdf-meta && go mod tidy && go build .
          cd ../cdf-ctl && go mod tidy && go build .

      - name: Go vet
        run: go vet ./cmd/...

  python:
    name: Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn sentence-transformers torch numpy scipy scikit-learn structlog requests sseclient-py

      - name: Download model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Python syntax check
        run: |
          python -m py_compile ai-services/embed-service/main.py
          python -m py_compile ai-services/drift-detector/main.py
