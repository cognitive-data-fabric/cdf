name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cognitive-data-fabric

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - {
              name: gateway,
              dockerfile: cmd/cdf-gateway/Dockerfile,
              context: cmd/cdf-gateway,
            }
          - {
              name: router,
              dockerfile: cmd/cdf-router/Dockerfile,
              context: cmd/cdf-router,
            }
          - {
              name: meta,
              dockerfile: cmd/cdf-meta/Dockerfile,
              context: cmd/cdf-meta,
            }
          - {
              name: storage,
              dockerfile: crates/cdf-storage/Dockerfile,
              context: .,
            }
          - {
              name: embed-service,
              dockerfile: ai-services/embed-service/Dockerfile,
              context: ai-services/embed-service,
            }
          - {
              name: drift-detector,
              dockerfile: ai-services/drift-detector/Dockerfile,
              context: ai-services/drift-detector,
            }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
