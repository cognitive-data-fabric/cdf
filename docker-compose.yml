version: "3.8"

# CDF Full Stack — Production-Ready Docker Compose
# Usage: docker-compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: cdf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cdf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-node-1:
    build:
      context: .
      dockerfile: crates/cdf-storage/Dockerfile
    container_name: cdf-storage-1
    ports:
      - "50051:50051"
    environment:
      CDF_NODE_ID: storage-1
      CDF_DATA_DIR: /data
      CDF_PORT: 50051
      CDF_SHARD_RANGE: 0-32767
    volumes:
      - storage_data_1:/data
    depends_on:
      - redis

  storage-node-2:
    build:
      context: .
      dockerfile: crates/cdf-storage/Dockerfile
    container_name: cdf-storage-2
    ports:
      - "50052:50051"
    environment:
      CDF_NODE_ID: storage-2
      CDF_DATA_DIR: /data
      CDF_PORT: 50051
      CDF_SHARD_RANGE: 32768-65535
    volumes:
      - storage_data_2:/data
    depends_on:
      - redis

  router:
    build:
      context: .
      dockerfile: cmd/cdf-router/Dockerfile
    container_name: cdf-router
    ports:
      - "50050:50050"
    environment:
      CDF_ROUTER_PORT: 50050
      CDF_STORAGE_NODES: storage-node-1:50051,storage-node-2:50051
    depends_on:
      - storage-node-1
      - storage-node-2

  meta:
    build:
      context: .
      dockerfile: cmd/cdf-meta/Dockerfile
    container_name: cdf-meta
    ports:
      - "50054:50054"
    environment:
      CDF_META_PORT: 50054
    depends_on:
      - redis

  gateway:
    build:
      context: .
      dockerfile: cmd/cdf-gateway/Dockerfile
    container_name: cdf-gateway
    ports:
      - "8080:8080"
    environment:
      CDF_HTTP_PORT: 8080
      CDF_GRPC_PORT: 50053
      CDF_ROUTER_ADDR: router:50050
      CDF_STORAGE_NODES: storage-node-1:50051,storage-node-2:50051
      REDIS_URL: redis:6379
      EMBED_URL: http://embed-service:8001
    depends_on:
      - router
      - meta
      - embed-service

  embed-service:
    build:
      context: ./ai-services/embed-service
      dockerfile: Dockerfile
    container_name: cdf-embed
    ports:
      - "8001:8001"
    environment:
      MODEL_CACHE_DIR: /models
      PORT: 8001
      DEVICE: cpu
    volumes:
      - model_cache:/models

  drift-detector:
    build:
      context: ./ai-services/drift-detector
      dockerfile: Dockerfile
    container_name: cdf-drift
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      EMBED_SERVICE_URL: http://embed-service:8001
    depends_on:
      - embed-service

  # Demo data seeder — runs once after services are up
  demo-seed:
    image: python:3.10-slim
    container_name: cdf-demo-seed
    volumes:
      - ./scripts/demo-seed.py:/seed.py:ro
    command: >
      sh -c "pip install --quiet requests &&
             sleep 30 &&
             python /seed.py"
    depends_on:
      - gateway
      - embed-service
    restart: "no"

volumes:
  storage_data_1:
  storage_data_2:
  model_cache:
  redis_data:
  minio_data:
