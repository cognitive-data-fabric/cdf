[package]
name = "cdf-auth"
version = "0.1.0"
edition = "2024"
authors = ["CDF Team"]
description = "RBAC, ACL, and JWT authentication for CDF"

[dependencies]
cdf-common = { path = "../cdf-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
jsonwebtoken = "9.3"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
